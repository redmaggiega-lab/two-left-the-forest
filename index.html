<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05090a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Two Left the Forest</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">

<style>
  :root {
    --ink:    #0a1512;
    --deep:   #05090a;
    --bone:   #e8e0cf;
    --moss:   #6f8a5f;
    --gold:   #e3c77a;
    --violet: #7b5ea8;
    --dim:    rgba(232,224,207,.55);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--deep);
    color: var(--bone);
    font-family: Spectral, Georgia, serif;
    font-weight: 300;
    -webkit-user-select: none; user-select: none;
  }

  .screen {
    position: fixed; inset: 0;
    display: none; flex-direction: column;
    padding: max(28px, env(safe-area-inset-top)) 26px
             max(28px, env(safe-area-inset-bottom)) 26px;
    overflow-y: auto;
  }
  .screen.on { display: flex; }

  /* ---------- the cover ---------- */
  #cover { justify-content: center; align-items: center; text-align: center; }

  #coverart {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; z-index: 0;
  }

  #cover .frame {
    position: relative; z-index: 1;
    max-width: 30rem; width: 100%;
    padding: 46px 30px;
    border-top: 1px solid rgba(227,199,122,.3);
    border-bottom: 1px solid rgba(227,199,122,.3);
    background: rgba(5,9,10,.30);
    backdrop-filter: blur(3px);
  }
  #cover h1 {
    font-size: clamp(2.3rem, 11vw, 3.6rem);
    font-weight: 400; line-height: 1.04;
    margin: 0 0 4px; letter-spacing: -.01em;
    text-shadow: 0 3px 24px #000, 0 0 60px rgba(0,0,0,.9);
  }
  #cover .sub {
    font-style: italic; color: var(--dim);
    font-size: 1.02rem; margin-bottom: 34px;
    text-shadow: 0 2px 12px #000;
  }

  /* the one animated moment in the whole app: the title settling in */
  #cover .frame > * { animation: settle .9s ease both; }
  #cover .frame > *:nth-child(2) { animation-delay: .18s; }
  #cover .frame > *:nth-child(3) { animation-delay: .34s; }
  @keyframes settle { from { opacity: 0; transform: translateY(9px); } }
  @media (prefers-reduced-motion: reduce) {
    #cover .frame > * { animation: none; }
  }

  /* ---------- buttons ---------- */
  button {
    font-family: inherit; color: var(--bone);
    background: none; border: none; cursor: pointer;
  }
  .major {
    display: block; width: 100%; max-width: 22rem; margin: 0 auto 11px;
    padding: 15px 20px; font-size: 1.06rem;
    border: 1px solid rgba(232,224,207,.28);
    background: rgba(232,224,207,.05);
  }
  .major:hover, .major:focus-visible {
    border-color: var(--gold); background: rgba(227,199,122,.09);
  }
  .major:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .quiet {
    font-size: .92rem; color: var(--dim);
    text-decoration: underline; text-underline-offset: 4px;
    padding: 12px;
  }

  /* ---------- lobby ---------- */
  #lobby { justify-content: center; align-items: center; text-align: center; }
  #lobby .inner { max-width: 26rem; width: 100%; }
  #lobby h2 { font-weight: 400; font-size: 1.5rem; margin: 0 0 6px; }
  #lobby p { color: var(--dim); line-height: 1.6; margin: 0 0 26px; }

  #code {
    font-size: clamp(2.6rem, 15vw, 4rem);
    letter-spacing: .22em; color: var(--gold);
    margin: 14px 0 6px; text-indent: .22em;
  }
  #codeinput {
    font-family: inherit; font-size: 2rem; letter-spacing: .2em;
    text-align: center; text-indent: .2em; width: 100%;
    padding: 14px; margin-bottom: 14px;
    background: rgba(232,224,207,.06); color: var(--bone);
    border: 1px solid rgba(232,224,207,.28); text-transform: uppercase;
  }
  #codeinput:focus { outline: none; border-color: var(--gold); }
  #lobbynote { color: var(--dim); font-style: italic; min-height: 1.5em; margin-top: 14px; }

  /* ---------- story pages ---------- */
  #story { justify-content: center; align-items: center; }
  #story .page { max-width: 33rem; width: 100%; }
  #story .chapno {
    color: var(--moss); font-style: italic; margin-bottom: 2px;
  }
  #story h2 {
    font-size: clamp(1.9rem, 8vw, 2.7rem); font-weight: 400;
    margin: 0 0 26px;
  }
  #story .prose p {
    font-size: 1.12rem; line-height: 1.75; margin: 0 0 1.1em;
    max-width: 34rem;
  }
  #story .prose p:last-child { margin-bottom: 34px; }

  /* ---------- the table of contents ---------- */
  #contents .chap {
    display: flex; align-items: baseline; gap: 14px;
    padding: 16px 4px;
    border-bottom: 1px solid rgba(232,224,207,.12);
    width: 100%; text-align: left;
  }
  #contents .chap .n {
    color: var(--moss); font-style: italic;
    flex: 0 0 7.4rem; font-size: .95rem;
  }
  #contents .chap .t { font-size: 1.15rem; }
  #contents .chap.locked { color: var(--dim); }
  #contents .chap.locked .t { font-style: italic; }
  #contents h2 { font-weight: 400; font-size: 1.5rem; margin: 0 0 8px; }
  #contents .lead { color: var(--dim); margin: 0 0 18px; }

  /* ---------- in game ---------- */
  #scene { position: fixed; inset: 0; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; }

  #link {
    position: absolute; top: max(14px, env(safe-area-inset-top)); left: 0; right: 0;
    text-align: center; font-style: italic; font-size: .92rem;
    color: var(--dim); text-shadow: 0 2px 8px #000;
  }
  #link.on { color: var(--moss); }
  #link.off { color: rgba(232,224,207,.4); }

  #whisper {
    position: absolute; left: 50%; top: 22%; transform: translateX(-50%);
    width: min(30rem, 82vw); text-align: center;
    font-size: 1.14rem; line-height: 1.5; font-style: italic;
    text-shadow: 0 2px 14px #000, 0 0 30px #000;
    opacity: 0; transition: opacity .5s;
  }
  #whisper.on { opacity: 1; }

  #stick {
    position: absolute; pointer-events: auto;
    left: max(26px, env(safe-area-inset-left)); bottom: max(34px, env(safe-area-inset-bottom));
    width: 128px; height: 128px; border-radius: 50%;
    border: 1px solid rgba(232,224,207,.22);
    background: rgba(232,224,207,.05);
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  #stick.live { border-color: rgba(227,199,122,.5); }
  #nub {
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(232,224,207,.3);
  }
  #jump {
    position: absolute; pointer-events: auto;
    right: max(26px, env(safe-area-inset-right)); bottom: max(46px, env(safe-area-inset-bottom));
    width: 96px; height: 96px; border-radius: 50%;
    border: 1px solid rgba(227,199,122,.45);
    background: rgba(227,199,122,.13);
    color: var(--gold); font-size: 1.02rem;
    touch-action: none;
  }
  #jump:active { background: rgba(227,199,122,.28); }

  #leave {
    position: absolute; pointer-events: auto;
    right: max(18px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top));
    font-size: .88rem; color: var(--dim); padding: 10px 12px;
  }

  .ver { color: rgba(232,224,207,.28); font-size: .82rem; margin-top: 22px; }

  #oops {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 99;
    display: none; padding: 14px 18px;
    background: #3a1d1d; color: #ffd9d9;
    font-size: .92rem; line-height: 1.45;
  }
  #oops.on { display: block; }
</style>
</head>
<body>

<div id="oops"></div>

<!-- ============ COVER ============ -->
<section id="cover" class="screen on">
  <canvas id="coverart"></canvas>
  <div class="frame">
    <h1>Two Left<br>the Forest</h1>
    <div class="sub">A story for two people, in five chapters</div>
    <div>
      <button class="major" id="begin">Start a new story</button>
      <button class="major" id="joinbtn">Join someone&rsquo;s story</button>
      <button class="quiet" id="solobtn">Walk in alone (to look around)</button>
      <div class="ver">Chapter One &middot; build 0.5</div>
    </div>
  </div>
</section>

<!-- ============ CONTENTS ============ -->
<section id="contents" class="screen">
  <h2>Contents</h2>
  <p class="lead">Only the first chapter is written so far.</p>
  <div id="chaplist"></div>
  <button class="quiet" data-back>Back to the cover</button>
</section>

<!-- ============ LOBBY ============ -->
<section id="lobby" class="screen">
  <div class="inner">
    <div id="lobbybody"></div>
    <div id="lobbynote"></div>
    <button class="quiet" data-back>Back to the cover</button>
  </div>
</section>

<!-- ============ STORY PAGE ============ -->
<section id="story" class="screen">
  <div class="page">
    <div class="chapno" id="chapno"></div>
    <h2 id="chaptitle"></h2>
    <div class="prose" id="chapprose"></div>
    <button class="major" id="storynext">Go on</button>
  </div>
</section>

<!-- ============ GAME ============ -->
<section id="play" class="screen" style="padding:0">
  <canvas id="scene"></canvas>
  <div id="hud">
    <div id="link">waiting for the other one</div>
    <div id="whisper"></div>
    <div id="stick"><div id="nub"></div></div>
    <button id="jump">Jump</button>
    <button id="leave">Leave</button>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="game.js"></script>

<script>
/* =====================================================
   THE BOOK — menus, lobby, story pages
   ===================================================== */

// Anything that goes wrong should say so on the screen. A silent
// failure on a phone is almost impossible to diagnose, because
// there's no console to open.
function fail(err) {
  const bar = document.getElementById("oops");
  bar.textContent = (err && err.message) ? err.message : String(err);
  bar.classList.add("on");
  console.error(err);
}
window.addEventListener("error", e => fail(e.error || e.message));

let soloMode = false;

// Firebase web keys are meant to be public; what protects the data
// is the security rules, not hiding this.
const firebaseConfig = {
  apiKey: "AIzaSyBYm2oJbIjh3kdZbTeWxbdctn6AXvf2Mzc",
  authDomain: "two-left-the-forest.firebaseapp.com",
  databaseURL: "https://two-left-the-forest-default-rtdb.firebaseio.com",
  projectId: "two-left-the-forest",
  storageBucket: "two-left-the-forest.firebasestorage.app",
  messagingSenderId: "506245106602",
  appId: "1:506245106602:web:171d147fe5fb4462b439d3"
};

// Firebase is started the first time we actually need it, not on
// page load. If it fails here it takes the whole script down with
// it, and every button on the cover stops working with nothing to
// show for it.
let db = null;

function getDb() {
  if (db) return db;
  if (typeof firebase === "undefined") {
    throw new Error("Firebase didn't load. Check your connection.");
  }
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  return db;
}

/* ---------- chapters ---------- */
const CHAPTERS = [
  { n: "Chapter One",   t: "The Waking",        ready: true },
  { n: "Chapter Two",   t: "The Lantern Court", ready: false },
  { n: "Chapter Three", t: "The Hollow",        ready: false },
  { n: "Chapter Four",  t: "The House That Waits", ready: false },
  { n: "Chapter Five",  t: "What the Forest Keeps", ready: false }
];

const OPENING = [
  "You do not remember lying down.",
  "Moss under your hands. Cold in your teeth. Above you the canopy is so thick that the sky is only a rumour of grey.",
  "Someone else is here. They woke the same way you did, in the same dark, with the same nothing behind their eyes. Neither of you knows the other's name yet.",
  "The trees are closer than they were."
];

/* ---------- screen switching ---------- */
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  document.getElementById(id).classList.add("on");
}

document.querySelectorAll("[data-back]").forEach(b => {
  b.onclick = () => { cleanupLobby(); show("cover"); };
});

/* ---------- contents ---------- */
function renderContents() {
  const box = document.getElementById("chaplist");
  box.innerHTML = "";
  CHAPTERS.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "chap" + (c.ready ? "" : " locked");
    b.innerHTML = '<span class="n">' + c.n + '</span>' +
                  '<span class="t">' + c.t + (c.ready ? '' : ' — not yet written') + '</span>';
    if (c.ready) b.onclick = () => hostGame();
    else b.disabled = true;
    box.appendChild(b);
  });
}

/* ---------- lobby ---------- */
let lobbyRef = null, myRoom = null, mySlot = null;

function makeCode() {
  // no I, O, 0 or 1 — they're the characters people misread aloud
  const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < 4; i++) {
    s += alphabet[Math.floor(Math.random() * alphabet.length)];
  }
  return s;
}

function cleanupLobby() {
  if (lobbyRef) { lobbyRef.off(); lobbyRef = null; }
}

document.getElementById("begin").onclick = () => {
  soloMode = false; renderContents(); show("contents");
};
document.getElementById("joinbtn").onclick = () => { soloMode = false; showJoin(); };
document.getElementById("solobtn").onclick = () => {
  soloMode = true;
  myRoom = "SOLO";
  mySlot = "p1";
  openChapter(1);
};

function hostGame() {
  soloMode = false;
  myRoom = makeCode();
  mySlot = "p1";
  show("lobby");
  document.getElementById("lobbybody").innerHTML =
    '<h2>Your story code</h2>' +
    '<p>Give this to the person playing with you. They tap ' +
    '&ldquo;Join someone&rsquo;s story&rdquo; and type it in.</p>' +
    '<div id="code">' + myRoom + '</div>';
  note("Waiting for them to join\u2026");

  const roomRef = getDb().ref("rooms/" + myRoom);
  roomRef.child("made").set(firebase.database.ServerValue.TIMESTAMP);
  roomRef.onDisconnect().remove();

  // when the second player's node appears, we both go
  lobbyRef = roomRef.child("players/p2");
  lobbyRef.on("value", snap => {
    if (snap.val()) { cleanupLobby(); openChapter(1); }
  });
}

function showJoin() {
  mySlot = "p2";
  show("lobby");
  document.getElementById("lobbybody").innerHTML =
    '<h2>Join a story</h2>' +
    '<p>Type the four letters the other person is looking at.</p>' +
    '<input id="codeinput" maxlength="4" autocapitalize="characters" ' +
    'autocomplete="off" spellcheck="false" inputmode="text">' +
    '<button class="major" id="godo">Walk in</button>';
  note("");

  const inp = document.getElementById("codeinput");
  inp.focus();
  document.getElementById("godo").onclick = tryJoin;
  inp.addEventListener("keydown", e => { if (e.key === "Enter") tryJoin(); });
}

function tryJoin() {
  const code = (document.getElementById("codeinput").value || "")
                 .trim().toUpperCase();
  if (code.length !== 4) { note("That code is four letters long."); return; }

  note("Looking for it\u2026");
  getDb().ref("rooms/" + code + "/made").once("value").then(snap => {
    if (!snap.exists()) {
      note("No story is waiting under that code. Check the letters.");
      return;
    }
    myRoom = code;
    openChapter(1);
  }).catch(err => {
    note("Couldn't reach the forest. Check your connection.");
    console.error(err);
  });
}

function note(t) { document.getElementById("lobbynote").textContent = t; }

/* ---------- story page, then play ---------- */
function openChapter(n) {
  const c = CHAPTERS[n - 1];
  document.getElementById("chapno").textContent = c.n;
  document.getElementById("chaptitle").textContent = c.t;
  document.getElementById("chapprose").innerHTML =
    OPENING.map(p => "<p>" + p + "</p>").join("");
  show("story");
  document.getElementById("storynext").onclick = () => startPlay(n);
}

function startPlay(n) {
  // game.js defines TLF. If it's missing, the script tag didn't
  // resolve — almost always because the two files got separated.
  if (typeof TLF === "undefined") {
    fail(new Error(
      "game.js didn't load. It has to sit in the same folder as " +
      "index.html — open the site through Netlify rather than " +
      "previewing index.html on its own."
    ));
    return;
  }
  show("play");
  try {
    TLF.start({
      room: myRoom,
      slot: mySlot,
      solo: soloMode,
      db: soloMode ? null : getDb(),
      onChapterEnd: endChapter
    });
  } catch (err) {
    show("cover");
    fail(err);
  }
}

function endChapter(n) {
  document.getElementById("chapno").textContent = "End of " + CHAPTERS[n - 1].n;
  document.getElementById("chaptitle").textContent = "She was waiting";
  document.getElementById("chapprose").innerHTML =
    "<p>She does not ask who you are. She already seems to know, " +
    "and she looks at only one of you when she says it.</p>" +
    "<p>&ldquo;Good,&rdquo; the witch says. &ldquo;Both of you. " +
    "That makes this simpler.&rdquo;</p>" +
    "<p>Chapter Two is not written yet.</p>";
  document.getElementById("storynext").textContent = "Close the book";
  document.getElementById("storynext").onclick = () => location.reload();
  show("story");
}

document.getElementById("leave").onclick = () => {
  if (confirm("Leave the forest? The other person will be alone.")) {
    TLF.stop();
    location.reload();
  }
};

/* =====================================================
   THE COVER
   -----------------------------------------------------
   Five bands of trees receding into fog, and two small
   figures standing apart at the bottom.

   The trees are painted once each into their own
   offscreen canvas, then that finished picture is just
   stamped onto the screen at a shifting offset. Redrawing
   four hundred triangles every frame would work, but it
   would also drain a phone battery for no visible gain.
   ===================================================== */
(function () {
  const canvas = document.getElementById("coverart");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // far to near: the fog eats contrast with distance
  const BANDS = [
    { color: "#24463a", top: 0.36, h: 0.30, n: 26, drift: 0.06 },
    { color: "#1a3529", top: 0.45, h: 0.36, n: 20, drift: 0.11 },
    { color: "#12241b", top: 0.54, h: 0.42, n: 15, drift: 0.18 },
    { color: "#0a1611", top: 0.63, h: 0.50, n: 11, drift: 0.28 },
    { color: "#030807", top: 0.74, h: 0.54, n: 8,  drift: 0.42 }
  ];

  let W = 0, H = 0, layers = [], motes = [], t0 = performance.now();

  function rand(seed) {
    // a fixed sequence, so the cover is composed rather than
    // rearranging itself every time the page loads
    let s = seed;
    return function () {
      s = (s * 16807) % 2147483647;
      return s / 2147483647;
    };
  }

  function buildLayer(band, index) {
    const c = document.createElement("canvas");
    // twice the width so we can scroll it without running out of picture
    c.width = W * 2;
    c.height = H;
    const g = c.getContext("2d");
    g.fillStyle = band.color;

    const r = rand(97 + index * 31);
    const baseY = H * (band.top + band.h);
    for (let i = 0; i < band.n * 2; i++) {
      const x = (i / (band.n * 2)) * W * 2 + (r() - 0.5) * 70;
      const treeH = H * band.h * (0.55 + r() * 0.75);
      const halfW = treeH * (0.16 + r() * 0.11);

      // a fir is a stack of tapering triangles
      const tiers = 4;
      for (let k = 0; k < tiers; k++) {
        const ty = baseY - (treeH / tiers) * k - treeH * 0.12;
        const tw = halfW * (1 - k * 0.17);
        const th = treeH * 0.42;
        g.beginPath();
        g.moveTo(x, ty - th);
        g.lineTo(x + tw, ty);
        g.lineTo(x - tw, ty);
        g.closePath();
        g.fill();
      }
      g.fillRect(x - halfW * 0.09, baseY - treeH * 0.12, halfW * 0.18, treeH * 0.14);
    }
    return c;
  }

  function figure(x, y, scale, glow) {
    // a person, small enough to read as a silhouette at a distance
    const s = scale;
    ctx.save();
    ctx.translate(x, y);

    const grad = ctx.createRadialGradient(0, -s * 3.4, 0, 0, -s * 3.4, s * 13);
    grad.addColorStop(0, glow + "aa");
    grad.addColorStop(0.45, glow + "22");
    grad.addColorStop(1, glow + "00");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, -s * 3.4, s * 13, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#020605";
    ctx.fillRect(-s * 0.9, -s * 5.4, s * 1.8, s * 3.1);   // torso
    ctx.beginPath();
    ctx.arc(0, -s * 6.1, s * 0.95, 0, Math.PI * 2);        // head
    ctx.fill();
    ctx.fillRect(-s * 0.75, -s * 2.4, s * 0.6, s * 2.4);   // legs
    ctx.fillRect(s * 0.15, -s * 2.4, s * 0.6, s * 2.4);

    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(s * 1.25, -s * 3.6, s * 0.42, 0, Math.PI * 2); // lantern
    ctx.fill();
    ctx.restore();
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    layers = BANDS.map(buildLayer);

    const r = rand(5150);
    motes = [];
    for (let i = 0; i < 70; i++) {
      motes.push({
        x: r() * W,
        y: H * 0.25 + r() * H * 0.6,
        r: 0.6 + r() * 1.7,
        phase: r() * Math.PI * 2,
        speed: 0.18 + r() * 0.5,
        sway: 8 + r() * 26
      });
    }
  }

  function draw(now) {
    const t = still ? 0 : (now - t0) / 1000;

    // night sky, and the moon behind everything
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#0d1f22");
    sky.addColorStop(0.45, "#0a1614");
    sky.addColorStop(1, "#04090a");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    function moon() {
      const mx = W * 0.73, my = H * 0.165;
      const halo = ctx.createRadialGradient(mx, my, 0, mx, my, H * 0.34);
      halo.addColorStop(0, "rgba(186,211,228,.34)");
      halo.addColorStop(0.22, "rgba(169,196,216,.11)");
      halo.addColorStop(1, "rgba(169,196,216,0)");
      ctx.fillStyle = halo;
      ctx.fillRect(0, 0, W, H);
      const disc = ctx.createRadialGradient(mx, my, 0, mx, my, H * 0.021);
      disc.addColorStop(0, "rgba(236,244,250,.92)");
      disc.addColorStop(0.7, "rgba(206,224,238,.7)");
      disc.addColorStop(1, "rgba(186,211,228,0)");
      ctx.fillStyle = disc;
      ctx.beginPath();
      ctx.arc(mx, my, H * 0.021, 0, Math.PI * 2);
      ctx.fill();
    }

    // the tree bands, each sliding at its own speed.
    // Fog is laid on thinly and only between bands — stacking five
    // heavy washes turns the whole picture to mud.
    layers.forEach((layer, i) => {
      if (i === 2) moon();
      const off = (t * BANDS[i].drift * 9) % W;
      ctx.drawImage(layer, -off, 0, W * 2, H);
      ctx.fillStyle = "rgba(12,28,25," + (0.17 - i * 0.028) + ")";
      ctx.fillRect(0, 0, W, H);
    });

    // motes
    motes.forEach(m => {
      const x = m.x + Math.sin(t * m.speed + m.phase) * m.sway;
      const y = m.y + Math.cos(t * m.speed * 0.7 + m.phase) * m.sway * 0.5;
      const a = 0.35 + Math.sin(t * 1.6 + m.phase) * 0.3;
      ctx.fillStyle = "rgba(227,199,122," + Math.max(0.06, a) + ")";
      ctx.beginPath();
      ctx.arc(x, y, m.r, 0, Math.PI * 2);
      ctx.fill();
    });

    // the two of them, standing further apart than they need to
    const floor = H * 0.955;
    const s = Math.max(3.4, H * 0.0088);
    figure(W * 0.27, floor, s, "#e3a44f");
    figure(W * 0.69, floor, s, "#5fb9b0");

    // vignette pulls the eye to the middle
    const vig = ctx.createRadialGradient(W / 2, H * 0.5, H * 0.2, W / 2, H * 0.5, H * 0.78);
    vig.addColorStop(0, "rgba(0,0,0,0)");
    vig.addColorStop(1, "rgba(0,0,0,.72)");
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
  }

  let raf = 0;
  function loop(now) {
    // only paint while the cover is the screen you're looking at
    if (!document.getElementById("cover").classList.contains("on")) {
      raf = requestAnimationFrame(loop);
      return;
    }
    draw(now);
    raf = requestAnimationFrame(loop);
  }

  window.addEventListener("resize", resize);
  resize();
  if (still) draw(t0);
  else raf = requestAnimationFrame(loop);
})();

/* ---------- offline support ---------- */

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
